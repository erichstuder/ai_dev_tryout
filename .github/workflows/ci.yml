name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and test in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            cargo fmt --check &&
            cargo clippy -- -D warnings &&
            cargo build --verbose &&
            cargo test --verbose
